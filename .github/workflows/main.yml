
name: Windows 16GB + Tailscale RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Check Hardware
        shell: pwsh
        run: |
          $cs = Get-CimInstance Win32_ComputerSystem
          $ram = [math]::Round($cs.TotalPhysicalMemory / 1GB, 2)

          Write-Host "RAM: $ram GB"
          Write-Host "CPU:"
          Get-CimInstance Win32_Processor |
            Format-Table Name, NumberOfCores, NumberOfLogicalProcessors

          Write-Host "GPU:"
          Get-CimInstance Win32_VideoController |
            Format-Table Name, AdapterRAM

          if ($ram -lt 15) {
            throw "Expected a 16GB RAM runner."
          }

      - name: Configure RDP
        shell: pwsh
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name UserAuthentication -Value 1

          Set-Service TermService -StartupType Automatic
          Start-Service TermService

      - name: Create RDP User
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if (-not $env:RDP_PASSWORD) {
            throw "Add RDP_PASSWORD to GitHub Secrets."
          }

          $password = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
            New-LocalUser -Name "RDP" -Password $password `
              -AccountNeverExpires
          } else {
            Set-LocalUser -Name "RDP" -Password $password
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

      - name: Install Tailscale
        shell: pwsh
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $url -OutFile $installer

          $process = Start-Process msiexec.exe `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait -PassThru

          Remove-Item $installer -Force

          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Tailscale installation failed."
          }

      - name: Connect Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if (-not $env:TS_AUTHKEY) {
            throw "Add TAILSCALE_AUTHKEY to GitHub Secrets."
          }

          $exe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $exe up "--authkey=$env:TS_AUTHKEY" `
            "--hostname=gh-cloud-$env:GITHUB_RUN_ID"

          $ip = $null

          for ($i = 0; $i -lt 20; $i++) {
            $ip = (& $exe ip -4 | Select-Object -First 1).Trim()

            if ($ip) { break }

            Start-Sleep -Seconds 5
          }

          if (-not $ip) {
            throw "Tailscale IP was not assigned."
          }

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

      - name: Configure Secure Firewall
        shell: pwsh
        run: |
          Disable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Remove-NetFirewallRule `
            -DisplayName "RDP-Tailscale" `
            -ErrorAction SilentlyContinue

          New-NetFirewallRule `
            -DisplayName "RDP-Tailscale" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress 100.64.0.0/10 `
            -Action Allow `
            -Profile Any

      - name: Verify RDP
        shell: pwsh
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $result = Test-NetConnection `
            -ComputerName 127.0.0.1 -Port 3389

          if (-not $result.TcpTestSucceeded) {
            throw "RDP service is not responding."
          }

          Write-Host "RDP service is ready."

      - name: Keep Cloud PC Running
        shell: pwsh
        run: |
          Write-Host "=========================="
          Write-Host "CLOUD PC READY"
          Write-Host "IP: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: Your GitHub Secret"
          Write-Host "=========================="

          while ($true) {
            Write-Host "Cloud PC Active: $(Get-Date)"
            Start-Sleep -Seconds 300
          }
